# Profil Azure
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Configuration SSL pour Azure PostgreSQL
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create
spring.docker.compose.enabled=false
# Configuration CORS pour l'environnement Azure
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allow-credentials=true
# URL du microservice de prediction pour le profil Azure/Prod
ms.prediction.url=${MS_PREDICTION_URL}
# Configuration des cookies de session pour cross-origin
server.forward-headers-strategy=framework
trader.app.security.jwtSecret=${TRADER_APP_JWT_SECRET}
trader.app.security.jwtExpirationMs=86400000
trader.app.cookie.secure=true
trader.app.cookie.maxAgeSeconds=86399
trader.app.cookie.sameSite=None
