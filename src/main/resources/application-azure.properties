# Profil Azure
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.docker.compose.enabled=false
# Configuration CORS pour l'environnement Azure
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourapp.azurewebsites.net}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allow-credentials=true
# URL du microservice de prédiction pour le profil Azure/Prod
# Utiliser une variable d?environnement si possible, avec une valeur par défaut indicative
ms.prediction.url=${MS_PREDICTION_URL:https://prediction-ms.prod/api/predict}
